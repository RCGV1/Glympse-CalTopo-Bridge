[package]
name = "glympse-caltopo-bridge"
version = "0.1.0"
description = "Cross-platform Glympse to CalTopo live tracking bridge"
authors = ["Benjamin Faershtein"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glympse_caltopo_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "glympse-caltopo-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = [] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.7"
urlencoding = "2.1.3"
